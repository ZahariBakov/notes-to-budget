form_script:
  written: "Скриптът за твоята Google форма е записан в: {file}"
  next_steps: |-
    За да създадеш формата (веднъж):
      1. Отвори https://script.google.com и започни нов проект.
      2. Замени всичко в редактора със съдържанието на файла по-горе.
      3. Избери функцията createBudgetForm и натисни Run (Изпълнение).
      4. Разреши на скрипта да създаде форма и таблица в твоя акаунт.
      5. Връзките към новата форма и таблица са в дневника (Log) и на първия лист.
    Добави формата на началния екран на телефона и тя работи като приложение.

app_settings:
  written: "Категориите и сметките ти за приложението са записани в: {file}"
  next_steps: |-
    После:
      1. Сложи този файл в папката apps_script, до appsscript.json.
      2. Качи приложението с:  clasp push
      3. Отвори таблицата си, презареди я и избери Бюджет > Подготви или обнови таблицата.
    След това категориите ти са в листа „Настройки“; променяй ги там.

