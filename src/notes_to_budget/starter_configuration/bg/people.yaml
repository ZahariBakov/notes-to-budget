# Хора, чиито имена се срещат в записките, и какво значи това за категорията.
# Хората се проверяват преди ключовите думи.
#
# Примерите са измислени – смени ги с твоите или изтрий реда.

people:
  # Разходите за това дете отиват в „Деца“, каквото и да е купено...
  - names: [Мими, Мария]
    category: Деца
    # ...освен подаръците: за тях решават ключовите думи.
    unless_description_contains: [подарък, рожден ден]

  # Само етикет: категорията се определя по покупката, името остава в описанието.
  - names: [Иван]
    category: ""
