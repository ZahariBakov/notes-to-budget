# Общи настройки.

# Език на таблицата и на съобщенията: bg или en.
language: bg

currency_symbol: "€"

# Имена на папките в твоята папка с данни.
folders:
  notes: Записки        # тук слагаш записките от телефона
  ledger: Дневник       # одобрените записи, по един файл на месец
  review: За проверка   # въпросите, които чакат твоя отговор

# Име на таблицата; {year} се заменя с годината.
workbook_file_name: "Бюджет {year}.xlsx"
