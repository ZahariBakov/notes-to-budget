# Как изглеждат твоите записки.
# (Ще се използва от етапа с четенето на записките.)
#
# Пример:
#   14 - 120 / 340 / 1500        ← денят и наличностите
#    - 12 - обяд - Р             ← разход от сметка Р
#    + 300 - наем - Б            ← приход в сметка Б
#    - 200 - от карта в брой     ← прехвърляне между твои сметки

# Кога пишеш наличностите: morning = сутринта, преди разходите за деня;
# evening = вечерта, след тях.
balance_line_is: morning

# true, ако най-новият ден е най-горе във файла.
newest_day_first: true

# Изречения за прехвърляне между сметки. {from} и {to} са сметките.
transfer_phrases:
  - "от {from} в {to}"

# Думи за спестявания.
savings_phrases:
  taken_out: [от спестени]
  put_in: [спестени]

investment_phrases: [инвестирани]

# Знак, с който отбелязваш, че не си сигурен в записа.
uncertain_marker: "?"
