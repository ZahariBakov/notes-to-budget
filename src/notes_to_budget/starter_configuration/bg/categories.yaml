# Твоите категории. Промени ги свободно: добавяй, махай, преименувай.
# Всяко име трябва да е единствено.

expense_groups:
  - name: Фиксирани
    categories:
      - name: Сметки
        includes: ток, вода, парно, интернет, телефон, банкови такси
      - name: Кредит
        includes: месечните вноски по кредити
      - name: Абонаменти
        includes: музика, филми, програми и други месечни услуги
      - name: Застраховки и данъци
        includes: застраховки и данъци на жилището

  - name: Ежедневни
    categories:
      - name: Пазар
        includes: супермаркети, храна и напитки за вкъщи
      - name: За дома
        includes: препарати, обзавеждане, техника, ремонти
      - name: Хранене в работа
        includes: обяд, закуски и кафе в работен ден
      - name: Хранене навън
        includes: ресторанти, доставки, всяка храна, която не е сготвена вкъщи
      - name: Заведения
        includes: кафе и напитки навън

  - name: Кола и транспорт
    categories:
      - name: Кола
        includes: застраховки, винетка, ремонт, гуми, мивка
      - name: Транспорт
        includes: гориво, зареждане, паркинг, билети

  - name: Семейство
    categories:
      - name: Деца
        includes: всичко за децата, без подаръците
      - name: Домашен любимец
        includes: храна, ветеринар

  - name: Лични и свободни
    categories:
      - name: Здраве
        includes: аптека, лекари, изследвания
      - name: Лична грижа
        includes: фризьор, козметика, хигиена
      - name: Дрехи
        includes: дрехи и обувки
      - name: Спорт
        includes: спортни занимания и екипировка
      - name: Забавления
        includes: кино, концерти, игри
      - name: Почивки
        includes: хотели и пътувания
      - name: Празници и подаръци
        includes: подаръци, рождени дни, поводи
      - name: Обучения
        includes: курсове, такси, книги

  - name: Други
    categories:
      - name: Други
        includes: каквото наистина не пасва никъде
      - name: Загубени
        includes: пари, за които няма запис

income_categories:
  - Заплата
  - Наем
  - Допълнителни

# Спестяванията и инвестициите не са разходи; показват се отделно.
savings_category: Спестявания
investments_category: Инвестиции

# Къде отива разход, който не пасва никъде, и къде – пари без запис.
# И двете трябва да са сред категориите за разходи по-горе.
fallback_category: Други
lost_money_category: Загубени
