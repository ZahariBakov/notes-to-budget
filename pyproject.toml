[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "notes-to-budget"
version = "0.0.1"
description = "Turn daily expense notes from your phone into a monthly budget workbook."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "openpyxl>=3.1",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[project.scripts]
notes-to-budget = "notes_to_budget.command_line.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
notes_to_budget = [
    "localization/locales/*.yaml",
    "starter_configuration/*/*.yaml",
    "google_form/*.gs",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
